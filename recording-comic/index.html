<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9d6ce" />
    <meta
      name="description"
      content="A temporary three-panel Orbit Comic page for recording the README demo."
    />
    <title>Orbit Comic — Recording Page</title>
  </head>
  <body>
    <main class="capture-stage" aria-label="Three-panel interactive comic">
      <article class="comic-page">
        <section
          id="orbit-panel"
          class="panel panel--hero is-loading"
          tabindex="0"
          role="application"
          aria-label="Interactive desert comic panel. Drag horizontally to change the view."
        >
          <img id="hero-poster" class="panel-image hero-poster" alt="A man and motorcycle in a desert" />
          <canvas id="orbit-canvas" aria-hidden="true"></canvas>
          <div id="load-state" class="load-state" aria-live="polite">
            <span id="load-label">Preparing scene</span>
            <span class="load-track" aria-hidden="true"><span id="load-progress"></span></span>
          </div>
        </section>

        <div class="lower-panels">
          <section class="panel panel--detail panel--shot" aria-label="A close-up of the gunshot">
            <img id="shot-image" class="panel-image" alt="A close-up of the man firing a handgun" />
            <div class="speech-bubble" aria-label="Ellipsis">…</div>
          </section>

          <section class="panel panel--detail panel--impact" aria-label="A bullet strikes a hat">
            <img id="impact-image" class="panel-image" alt="A bullet striking a hat above the desert" />
            <p class="caption-box">Something’s off.</p>
          </section>
        </div>
      </article>

      <p id="status" class="sr-only" aria-live="polite">Preparing the interactive panel.</p>
      <div id="demo-cursor" class="demo-cursor" aria-hidden="true">
        <svg class="demo-cursor__pointer" viewBox="0 0 32 38" role="presentation">
          <path d="M3 2.5v28l7.1-6.2 5.2 10.4 5-2.6-5.2-9.9 10.2-.8z" />
        </svg>
        <svg class="demo-cursor__hand" viewBox="0 0 50 58" role="presentation">
          <rect x="9" y="10" width="8" height="29" rx="4" />
          <rect x="18" y="4" width="8" height="35" rx="4" />
          <rect x="27" y="7" width="8" height="32" rx="4" />
          <rect x="36" y="13" width="8" height="27" rx="4" />
          <path d="M10 30h29c5 0 8 4 8 9v2c0 9-7 14-17 14h-9c-9 0-14-4-18-12L.9 38c-1.1-2.5 0-5.4 2.5-6.5 2.1-.9 4.5-.2 5.8 1.8l4 6.1" />
        </svg>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
